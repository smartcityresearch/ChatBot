sonar.exclusions=frontend/**, cypress/**, cypress.config.js, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/node_modules/**, **/dist/**, **/build/**, **/.next/**, **/out/**, **/coverage/**, **/__tests__/**, **/*.d.ts, **/*.md, backend/tests/**, tests/**, **/test_*.py, **/*_test.py, backend/scripts/**, backend/pydevs_logs/**, backend/modules/pydevs/**, backend/experiments/**, backend/__pycache__/**, backend/modules/__pycache__/**, backend/routes/__pycache__/**, backend/venv/**, backend/.venv/**, models/**, dt-hardware/**, Digital-Twin-Demo-Board-Hardware-V2-2026/**, node-simulator/**, docker-postgres/**, database/**, MISC/**, resources/**

# Code Coverage Reports (Backend Python Coverage Only)
sonar.python.coverage.reportPaths=backend/backend-coverage.xml

# 4. Coverage Exclusions (Exclude non-production backend modules and test folders)
sonar.coverage.exclusions=backend/tests/**, tests/**, **/test_*.py, **/*_test.py, backend/examples/**, backend/modules/node.py, backend/modules/pydevs/**, backend/experiments/**, backend/modules/adaptation_*.py, backend/modules/baseline_framework.py, backend/modules/dt_fidelity.py, backend/modules/domain_registry.py, backend/modules/evaluation_framework.py, backend/modules/experiment_manager.py, backend/modules/fault_*.py, backend/modules/ground_truth.py, backend/modules/integrated_experiments.py, backend/modules/protocol_layer.py, backend/modules/statistical_analysis.py, backend/modules/structured_logger.py, backend/modules/thermal_simulator.py, backend/modules/trace_context.py, Digital-Twin-Demo-Board-Hardware-V2-2026/**, node-simulator/**

